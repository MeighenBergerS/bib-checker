[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bib-checker"
version = "0.1.0"
description = "Check .bib file citations against InspireHEP and suggest replacements."
requires-python = ">=3.11"
dependencies = [
    "bibtexparser>=2.0.0b7",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "responses>=0.25",   # mock requests HTTP calls in tests
]

[project.scripts]
bib-checker = "bib_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
